name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify release tag and committed version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node scripts/check-release.mjs
          git merge-base --is-ancestor HEAD origin/master
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node scripts/check-release.mjs
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Pack the committed source
        id: pack
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const [pack] = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/pack.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'filename=' + pack.filename + '\n');
          JS
      - name: Attach package and checksum to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_FILE: ${{ steps.pack.outputs.filename }}
        run: |
          cd "$RUNNER_TEMP"
          sha256sum "$PACKAGE_FILE" > "$PACKAGE_FILE.sha256"
          gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" "$PACKAGE_FILE.sha256" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish to npm with trusted publishing
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.filename }}
        run: npm publish "$RUNNER_TEMP/$PACKAGE_FILE" --access public
