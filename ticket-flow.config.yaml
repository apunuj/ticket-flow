# ticket-flow.config.yaml — generated for Ticket-Flow 0.7.0.
# ticket-flow.config.yaml — generated by `ticket-flow init`.
# Advanced knobs (state names, branchPattern, mergeStrategy, conventions, review checks)
# fall back to sensible defaults; see templates/ticket-flow.config.yaml to customize them.

project:
  name: ticket-flow
backend:
  type: linear
git:
  baseBranch: master
test:
  command: npm test
tools:
  - claude
  - codex

# Optional: model split for /orchestrate-ticket. Leave unset to be asked per run;
# set BOTH keys to skip the question. A per-run instruction always wins (that run only).
# orchestrate:
#   plannerModel: ""       # strongest model — plans and reviews
#   implementerModel: ""   # worker model — builds and fixes
